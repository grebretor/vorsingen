<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vorsingen – RIAS Kammerchor Berlin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink:    #1b1f24;
      --paper:  #f4f3f1;
      --card:   #ffffff;
      --blue:   #646870;   /* RKC Corporate Grau  */
      --blue2:  #4a4d54;   /* Dunklere Variante   */
      --gold:   #a07830;   /* Warmes Akzentgold   */
      --green:  #2a6040;
      --red:    #7c1f1f;
      --muted:  #767a82;
      --border: #dcdad6;
      --s-bg:   #fce8e8;
      --a-bg:   #e8f2ec;
      --t-bg:   #e8eaf4;
      --b-bg:   #f5efe2;
      --s-col:  #8b1c1c;
      --a-col:  #1a5230;
      --t-col:  #2a3480;
      --b-col:  #6b4010;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────────────────── */
    header {
      background: var(--blue);
      color: white;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      border-bottom: 3px solid var(--gold);
    }
    header .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }
    header .logo span { display: block; font-size: 0.72rem; font-family: 'Source Sans 3', sans-serif; font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; }
    header .divider { width: 1px; height: 2.5rem; background: rgba(255,255,255,0.25); }
    header .subtitle { font-size: 0.85rem; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }

    /* ── PROGRESS ────────────────────────────────────────────────────── */
    .progress-wrap {
      background: var(--blue);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0 2rem 0;
      display: flex;
      align-items: stretch;
    }
    .progress-step {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      cursor: default;
    }
    .progress-step.done  { color: rgba(255,255,255,0.6); border-bottom-color: rgba(255,255,255,0.3); cursor: pointer; }
    .progress-step.done:hover { color: white; background: rgba(255,255,255,0.08); }
    .progress-step.active{ color: white; border-bottom-color: var(--gold); }

    /* ── LAYOUT ──────────────────────────────────────────────────────── */
    .container { max-width: 860px; margin: 2rem auto; padding: 0 1.25rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--blue);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── BUTTONS ─────────────────────────────────────────────────────── */
    .btn {
      padding: 0.55rem 1.3rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: var(--blue); color: white; }
    .btn-primary:not(:disabled):hover { background: var(--blue2); }
    .btn-outline  { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
    .btn-outline:hover { background: #eef3fa; }
    .btn-ghost    { background: var(--paper); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #ede9e0; }
    .btn-danger   { background: var(--red); color: white; }
    .btn-sm       { padding: 0.25rem 0.7rem; font-size: 0.8rem; }

    .btn-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1.25rem; }
    .btn-row .right { display: flex; gap: 0.6rem; }

    /* ── FORMS ───────────────────────────────────────────────────────── */
    .form-row { display: flex; gap: 0.75rem; align-items: flex-end; margin-bottom: 1rem; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
    .form-group.wide { flex: 2; }

    input[type="text"], select {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.95rem;
      background: white;
      color: var(--ink);
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus { outline: none; border-color: var(--blue); }

    /* ── TABLE ───────────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th {
      background: var(--blue);
      color: white;
      padding: 0.55rem 0.85rem;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-size: 0.82rem;
      text-transform: uppercase;
    }
    tbody td { padding: 0.55rem 0.85rem; border-bottom: 1px solid #f0ece3; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #faf8f3; }
    td.center { text-align: center; }

    /* ── BADGE ───────────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .badge-S { background: var(--s-bg); color: var(--s-col); }
    .badge-A { background: var(--a-bg); color: var(--a-col); }
    .badge-T { background: var(--t-bg); color: var(--t-col); }
    .badge-B { background: var(--b-bg); color: var(--b-col); }

    /* ── ANWESENHEIT ─────────────────────────────────────────────────── */
    .sg-section-label {
      display: flex; align-items: center; gap: 0.5rem;
      margin: 1.1rem 0 0.5rem;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.5rem;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-size: 0.9rem;
      user-select: none;
      -webkit-user-select: none;
    }
    .check-item:hover { background: #eeedf0; border-color: var(--blue); }
    .check-item:has(input:checked) {
      background: var(--blue);
      color: white;
      border-color: var(--blue2);
    }
    .check-item input[type=checkbox] { accent-color: white; cursor: pointer; width: 1.1rem; height: 1.1rem; flex-shrink: 0; }

    /* ── ABSTIMMUNG ──────────────────────────────────────────────────── */
    .voter-progress {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      background: #ededee;
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: var(--blue);
      font-weight: 600;
    }
    .voter-progress .fraction { margin-left: auto; font-size: 0.82rem; color: var(--muted); font-weight: 400; }

    .kandidat-vote-row {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }
    .kv-name {
      padding: 0.6rem 1rem;
      font-weight: 600;
      font-size: 0.92rem;
      background: #f8f7f4;
      border-bottom: 1px solid var(--border);
    }
    .kv-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .kv-btn {
      padding: 0.75rem 0.4rem;
      text-align: center;
      font-size: 0.88rem;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-right: 1px solid var(--border);
      background: white;
      color: var(--ink);
      transition: background 0.12s, color 0.12s;
      letter-spacing: 0.02em;
    }
    .kv-btn:last-child { border-right: none; }
    .kv-btn:hover { background: #eeedf0; }
    .kv-btn.active-V { background: #2a6e3f; color: white; }
    .kv-btn.active-G { background: #b8860b; color: white; }
    .kv-btn.active-S { background: #7c5a10; color: white; }
    .kv-btn.active-N { background: #9c2020; color: white; }
    @media (max-width: 500px) {
      .kv-options { grid-template-columns: repeat(2, 1fr); }
      .kv-btn { padding: 0.9rem 0.4rem; border-bottom: 1px solid var(--border); }
    }

    /* ── MOBILE HOCHFORMAT ───────────────────────────────────────────── */
    @media (max-width: 480px) and (orientation: portrait) {

      /* Header kompakter */
      header { padding: 0.85rem 1rem; gap: 0; }
      header .divider, header .subtitle { display: none; }
      header .logo { font-size: 0.95rem; }

      /* Progress: nur Ziffern */
      .progress-wrap { padding: 0; }
      .progress-step { font-size: 0.7rem; padding: 0.5rem 0.2rem; letter-spacing: 0; }
      .progress-step::before {
        display: block;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      /* Container & Cards */
      .container { margin: 0.75rem auto; padding: 0 0.75rem; }
      .card { padding: 1rem; }
      .card-title { font-size: 1rem; margin-bottom: 0.9rem; }

      /* Phase 1: Formularzeile stapeln */
      .form-row {
        flex-direction: column;
        gap: 0.6rem;
      }
      .form-group.wide, .form-group { flex: unset; width: 100%; }
      .form-row > div:last-child { width: 100%; }
      .form-row .btn { width: 100%; padding: 0.75rem; font-size: 1rem; }

      /* Eingabefelder größer für Mobilgeräte */
      input[type="text"], select {
        font-size: 1rem;
        padding: 0.75rem 0.9rem;
      }

      /* Tabelle Phase 1 (Kandidatenliste) */
      #kandidatenTable { font-size: 0.82rem; }
      #kandidatenTable thead th,
      #kandidatenTable tbody td { padding: 0.45rem 0.5rem; }

      /* Navigationsbuttons */
      .btn-row { flex-wrap: wrap; gap: 0.5rem; }
      .btn-row .right { width: 100%; }
      .btn-row .right .btn,
      .btn-row > .btn-primary { width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; }
      .btn-row > .btn-ghost { width: 100%; text-align: center; padding: 0.65rem; }

      /* Anwesenheit: zwei Spalten */
      .checkbox-grid { grid-template-columns: repeat(2, 1fr); gap: 0.4rem; }
      .check-item { padding: 0.6rem 0.75rem; font-size: 0.85rem; }

      /* Abstimmung */
      .voter-progress { font-size: 0.85rem; padding: 0.6rem 0.75rem; }
      .kv-name { font-size: 0.88rem; padding: 0.5rem 0.75rem; }
      .kv-options { grid-template-columns: repeat(2, 1fr); }
      .kv-btn { padding: 0.85rem 0.4rem; font-size: 0.85rem; }

      /* Ergebnis: Tabelle scrollbar + kompakter */
      .res-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .res-table { font-size: 0.78rem; min-width: 420px; }
      .res-table thead th,
      .res-table tbody td { padding: 0.4rem 0.5rem; }

      /* Erläuterungstexte */
      #ergebnisBeschreibungen > div { font-size: 0.82rem; line-height: 1.5; }

      /* Ergebnis-Buttons */
      .btn-row .btn-outline, .btn-row .btn-primary { flex: 1; text-align: center; }
    }

    /* ── ERGEBNIS ────────────────────────────────────────────────────── */
    .result-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.7;
    }
    .result-meta em { color: var(--gold); font-style: normal; font-weight: 600; }

    .res-table th.cat-v { background: #2a6e3f; }
    .res-table th.cat-g { background: #b8860b; }
    .res-table th.cat-n { background: #9c2020; }
    .res-table .tendenz { font-weight: 700; letter-spacing: 0.02em; }

    /* ── ALERT ───────────────────────────────────────────────────────── */
    .alert {
      padding: 0.7rem 1rem;
      border-radius: 4px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }
    .alert-info    { background: #ededee; color: #3a3d45; border-left: 3px solid var(--blue); }
    .alert-warning { background: #fff8e6; color: #7c5800; border-left: 3px solid var(--gold); }
    .alert-error   { background: #fce8e8; color: #8b1a1a; border-left: 3px solid #8b1a1a; }

    /* ── PHASE VISIBILITY ────────────────────────────────────────────── */
    .phase { display: none; }
    .phase.active { display: block; }

    /* ── PRINT ───────────────────────────────────────────────────────── */
    @media print {
      header .subtitle, .progress-wrap, .btn-row, .no-print { display: none !important; }
      .card { box-shadow: none; }
      body { background: white; }
    }
  </style>
</head>
<body>

<header>
  <img src="logo_rkc.png" alt="RIAS Kammerchor Berlin"
       style="height:2.8rem;width:auto;flex-shrink:0;">
  <div class="logo">
    RIAS Kammerchor Berlin
    <span>Vorsingen · Auswertung</span>
  </div>
  <div class="divider"></div>
  <div class="subtitle">Abstimmungserfassung</div>
</header>

<div class="progress-wrap">
  <div class="progress-step active" id="step1">1 · Kandidaten</div>
  <div class="progress-step"        id="step2">2 · Anwesenheit</div>
  <div class="progress-step"        id="step3">3 · Abstimmung</div>
  <div class="progress-step"        id="step4">4 · Ergebnis</div>
</div>

<div class="container">

  <!-- ══════════════════════════════════════════════════════════════════
       PHASE 1 – Kandidaten
  ══════════════════════════════════════════════════════════════════ -->
  <div class="phase active" id="phase1">
    <div class="card">
      <div class="card-title">Kandidaten eintragen</div>
      <div class="form-row">
        <div class="form-group wide">
          <label>Name</label>
          <input type="text" id="kandidatName" placeholder="Vorname Nachname">
        </div>
        <div class="form-group">
          <label>Stimmgruppe</label>
          <select id="kandidatSg">
            <option value="Sopran">Sopran</option>
            <option value="Alt">Alt</option>
            <option value="Tenor">Tenor</option>
            <option value="Bass">Bass</option>
          </select>
        </div>
        <div>
          <button class="btn btn-primary" onclick="addKandidat()">+ Hinzufügen</button>
        </div>
      </div>

      <table id="kandidatenTable">
        <thead>
          <tr>
            <th style="width:2.5rem">#</th>
            <th>Name</th>
            <th>Stimmgruppe</th>
            <th style="width:3rem"></th>
          </tr>
        </thead>
        <tbody id="kandidatenBody">
          <tr id="emptyRow">
            <td colspan="4" style="text-align:center; color:var(--muted); padding:1.5rem; font-style:italic;">
              Noch keine Kandidaten eingetragen.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="btn-row">
      <span style="font-size:0.85rem; color:var(--muted)" id="kandidatCount">0 Kandidaten</span>
      <button class="btn btn-primary" id="btnToPhase2" onclick="goToPhase2()" disabled>
        Weiter zur Anwesenheit →
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
       PHASE 2 – Anwesenheit
  ══════════════════════════════════════════════════════════════════ -->
  <div class="phase" id="phase2">
    <div class="card">
      <div class="card-title">Anwesenheit der Chormitglieder</div>
      <div class="alert alert-info" id="loadingAlert">⏳ Mitglieder werden geladen…</div>
      <div id="anwesenheitBody" style="display:none"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goToPhase(1)">← Zurück</button>
      <div class="right">
        <span style="font-size:0.85rem; color:var(--muted); align-self:center" id="anwesenheitCount"></span>
        <button class="btn btn-primary" id="btnToPhase3" onclick="startAbstimmung()" disabled>
          Abstimmung starten →
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
       PHASE 3 – Abstimmung
  ══════════════════════════════════════════════════════════════════ -->
  <div class="phase" id="phase3">
    <div class="card" id="abstimmungCard">
      <div class="card-title" id="abstimmungTitel">…</div>
      <div class="voter-progress" id="voterProgress"></div>
      <div id="sgFortschritt" style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1rem"></div>
      <div id="voteForm"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="prevVoter()">← Zurück</button>
      <button class="btn btn-primary" id="btnNextVoter" onclick="nextVoter()">Weiter →</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
       PHASE 4 – Ergebnis
  ══════════════════════════════════════════════════════════════════ -->
  <div class="phase" id="phase4">
    <div class="card" id="ergebnisCard">
      <div class="card-title">Auswertungsergebnis</div>
      <div class="result-meta" id="resultMeta"></div>
      <div id="ergebnisTabelle"></div>
    </div>

    <div class="btn-row no-print">
      <button class="btn btn-ghost" onclick="goToPhase(3)">← Zurück</button>
      <div class="right">
        <button class="btn btn-outline" onclick="exportCSV()">📥 CSV</button>
        <button class="btn btn-primary" onclick="window.print()">🖨️ Drucken</button>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script>
// ════════════════════════════════════════════════════════════════════════
// KONFIGURATION – Supabase-Zugangsdaten hier eintragen
// ════════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://lqfoybhgtlyvnbtuwggi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MJUP_gLZccCY-UUlF1p7oQ_JB1hta_g';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false }
});

// ════════════════════════════════════════════════════════════════════════
// APP-STATE
// ════════════════════════════════════════════════════════════════════════
const KATEGORIEN   = ['Vakanz', 'Gast', 'Nein'];
const STIMMGRUPPEN = ['Sopran', 'Alt', 'Tenor', 'Bass'];

let kandidaten         = [];  // [{id, name, stimmgruppe}]
let alleMitglieder     = [];  // aus Supabase: [{id, name, stimmgruppe}]
let anwesendeMitglieder= [];  // gefiltertes Array nach Phase 2
let stimmen            = {};  // {mitgliedId: {kandidatId: Kategorie}}
let currentVoterIdx    = 0;

// ════════════════════════════════════════════════════════════════════════
// HILFSFUNKTIONEN
// ════════════════════════════════════════════════════════════════════════
function badge(sg) {
  const k = sg ? sg[0].toUpperCase() : '?';
  return `<span class="badge badge-${k}">${k}</span>`;
}

function csvBom() { return String.fromCharCode(0xFEFF); }

function setAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.style.display = 'block';
}

// ════════════════════════════════════════════════════════════════════════
// PHASE 1 – KANDIDATEN
// ════════════════════════════════════════════════════════════════════════
function addKandidat() {
  const name = document.getElementById('kandidatName').value.trim();
  const sg   = document.getElementById('kandidatSg').value;
  if (!name) return;
  kandidaten.push({ id: Date.now() + Math.random(), name, stimmgruppe: sg });
  document.getElementById('kandidatName').value = '';
  document.getElementById('kandidatName').focus();
  renderKandidaten();
}

document.getElementById('kandidatName')
  .addEventListener('keydown', e => { if (e.key === 'Enter') addKandidat(); });

function removeKandidat(id) {
  kandidaten = kandidaten.filter(k => k.id !== id);
  renderKandidaten();
}

function renderKandidaten() {
  const tbody = document.getElementById('kandidatenBody');
  if (kandidaten.length === 0) {
    tbody.innerHTML = `<tr id="emptyRow"><td colspan="4" style="text-align:center;color:var(--muted);padding:1.5rem;font-style:italic;">Noch keine Kandidaten eingetragen.</td></tr>`;
  } else {
    tbody.innerHTML = kandidaten.map((k, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${k.name}</td>
        <td>${badge(k.stimmgruppe)}</td>
        <td><button class="btn btn-danger btn-sm" onclick="removeKandidat(${k.id})">✕</button></td>
      </tr>`).join('');
  }
  const n = kandidaten.length;
  document.getElementById('kandidatCount').textContent = `${n} Kandidat${n !== 1 ? 'en' : ''}`;
  document.getElementById('btnToPhase2').disabled = n === 0;
}

// ════════════════════════════════════════════════════════════════════════
// PHASE 2 – ANWESENHEIT
// ════════════════════════════════════════════════════════════════════════
async function goToPhase2() {
  goToPhase(2);
  await loadMitglieder();
}

async function loadMitglieder() {
  document.getElementById('loadingAlert').style.display = 'block';
  document.getElementById('anwesenheitBody').style.display = 'none';

  const { data, error } = await sb
    .from('mitglieder')
    .select('id, vorname, nachname, stimme')
    .order('stimme')
    .order('nachname');

  if (error) {
    setAlert('loadingAlert', 'error', '❌ Fehler beim Laden: ' + error.message);
    return;
  }

  alleMitglieder = data;
  document.getElementById('loadingAlert').style.display = 'none';
  renderAnwesenheit();
}

function renderAnwesenheit() {
  const body = document.getElementById('anwesenheitBody');
  const grouped = {};
  STIMMGRUPPEN.forEach(sg => { grouped[sg] = []; });
  // Normalisieren: erkennt "Sopran"/"S"/"s", "Alt"/"A", "Tenor"/"T", "Bass"/"B" etc.
  const norm = s => {
    if (!s) return 'Bass';
    const v = s.trim().toLowerCase();
    if (v.startsWith('s')) return 'Sopran';
    if (v.startsWith('a')) return 'Alt';
    if (v.startsWith('t')) return 'Tenor';
    return 'Bass';
  };
  alleMitglieder.forEach(m => {
    const sg = norm(m.stimme);
    if (grouped[sg]) grouped[sg].push(m);
    else grouped['Bass'].push(m);
  });

  body.innerHTML = STIMMGRUPPEN.map(sg => {
    if (!grouped[sg]?.length) return '';
    return `
      <div class="sg-section-label">${badge(sg)} ${sg}</div>
      <div class="checkbox-grid" style="margin-bottom:0.75rem">
        ${grouped[sg].map(m => `
          <label class="check-item">
            <input type="checkbox" id="an_${m.id}" value="${m.id}" onchange="updateAnwesenheitCount()">
            ${m.vorname} ${m.nachname}
          </label>`).join('')}
      </div>`;
  }).join('');

  body.style.display = 'block';
  updateAnwesenheitCount();
}

function updateAnwesenheitCount() {
  const checked = [...document.querySelectorAll('#anwesenheitBody input[type=checkbox]:checked')];
  const n = checked.length;
  document.getElementById('anwesenheitCount').textContent = `${n} anwesend`;
  document.getElementById('btnToPhase3').disabled = n === 0;
}

function normStimme(s) {
  if (!s) return 'Bass';
  const v = s.trim().toLowerCase();
  if (v.startsWith('s')) return 'Sopran';
  if (v.startsWith('a')) return 'Alt';
  if (v.startsWith('t')) return 'Tenor';
  return 'Bass';
}

function startAbstimmung() {
  const ids = new Set(
    [...document.querySelectorAll('#anwesenheitBody input:checked')].map(c => c.value)
  );
  const ausgewählt = alleMitglieder.filter(m => ids.has(String(m.id)));

  // Anonymisierung: innerhalb jeder Stimmgruppe zufällig mischen, dann nummerieren
  const shuffle = arr => arr.sort(() => Math.random() - 0.5);
  const grouped = {};
  STIMMGRUPPEN.forEach(sg => { grouped[sg] = []; });
  ausgewählt.forEach(m => grouped[normStimme(m.stimme)].push(m));

  anwesendeMitglieder = [];
  STIMMGRUPPEN.forEach(sg => {
    let i = 0;
    shuffle(grouped[sg]).forEach(m => {
      i++;
      anwesendeMitglieder.push({ ...m, anonLabel: `${sg} ${i}` });
    });
  });

  // Stimmen-Objekt initialisieren (Default: Nein)
  stimmen = {};
  anwesendeMitglieder.forEach(m => {
    stimmen[m.id] = {};
    kandidaten.forEach(k => { stimmen[m.id][k.id] = 'Nein'; });
  });

  currentVoterIdx = 0;
  goToPhase(3);
  renderVoteForm();
}

// ════════════════════════════════════════════════════════════════════════
// PHASE 3 – ABSTIMMUNG
// ════════════════════════════════════════════════════════════════════════
function renderVoteForm() {
  const voter = anwesendeMitglieder[currentVoterIdx];
  const total = anwesendeMitglieder.length;

  document.getElementById('abstimmungTitel').innerHTML =
    `Stimme von: <strong>${voter.anonLabel}</strong>`;

  // ── Fortschritt gesamt ────────────────────────────────────────────
  document.getElementById('voterProgress').innerHTML =
    `Mitglied ${currentVoterIdx + 1} von ${total}
     <span class="fraction">${Math.round((currentVoterIdx + 1) / total * 100)} %</span>`;

  // ── Fortschritt nach Stimmgruppe ──────────────────────────────────
  const sgStatus = {};
  STIMMGRUPPEN.forEach(sg => { sgStatus[sg] = { fertig: 0, gesamt: 0 }; });
  anwesendeMitglieder.forEach((m, idx) => {
    const sg = m.anonLabel.split(' ')[0];
    if (sgStatus[sg]) {
      sgStatus[sg].gesamt++;
      if (idx < currentVoterIdx) sgStatus[sg].fertig++;
    }
  });

  const sgBadgeColor = { Sopran: 'var(--s-col)', Alt: 'var(--a-col)', Tenor: 'var(--t-col)', Bass: 'var(--b-col)' };
  const sgBgColor    = { Sopran: 'var(--s-bg)',  Alt: 'var(--a-bg)',  Tenor: 'var(--t-bg)',  Bass: 'var(--b-bg)'  };

  const sgHtml = STIMMGRUPPEN
    .filter(sg => sgStatus[sg].gesamt > 0)
    .map(sg => {
      const { fertig, gesamt } = sgStatus[sg];
      const alleErledigt = fertig === gesamt;
      const bg    = alleErledigt ? '#e8f2ec' : sgBgColor[sg];
      const color = alleErledigt ? '#1a5230' : sgBadgeColor[sg];
      const icon  = alleErledigt ? '✓ ' : '';
      return `<span style="display:inline-flex;align-items:center;gap:0.3rem;
                background:${bg};color:${color};
                padding:0.2rem 0.6rem;border-radius:3px;
                font-size:0.78rem;font-weight:700;letter-spacing:0.03em">
        ${icon}${sg[0]} ${fertig}/${gesamt}
      </span>`;
    }).join('');

  document.getElementById('sgFortschritt').innerHTML = sgHtml;

  document.getElementById('btnNextVoter').textContent =
    currentVoterIdx < total - 1 ? 'Weiter →' : 'Auswertung anzeigen ✓';

  const catKey = { 'Vakanz': 'V', 'Gast': 'G', 'Nein': 'N' };

  document.getElementById('voteForm').innerHTML = kandidaten.map(k => {
    const cur = stimmen[voter.id]?.[k.id] || 'Nein';
    return `
      <div class="kandidat-vote-row">
        <div class="kv-name">${k.name} ${badge(k.stimmgruppe)}</div>
        <div class="kv-options">
          ${KATEGORIEN.map(kat => {
            const ck = catKey[kat];
            const isActive = cur === kat ? ` active-${ck}` : '';
            return `<button class="kv-btn${isActive}"
              onclick="selectVote('${voter.id}', ${k.id}, '${kat}', this)"
              data-kid="${k.id}" data-kat="${kat}">${kat}</button>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
}

const catKey = { 'Vakanz': 'V', 'Gast': 'G', 'Nein': 'N' };

function selectVote(mid, kid, kat, btn) {
  stimmen[mid][kid] = kat;
  // Alle Buttons dieser Zeile zurücksetzen, dann aktiven hervorheben
  const row = btn.closest('.kv-options');
  row.querySelectorAll('.kv-btn').forEach(b => {
    b.className = 'kv-btn';
  });
  btn.classList.add(`active-${catKey[kat]}`);
}

function prevVoter() {
  if (currentVoterIdx > 0) { currentVoterIdx--; renderVoteForm(); }
  else goToPhase(2);
}

function nextVoter() {
  currentVoterIdx++;
  if (currentVoterIdx >= anwesendeMitglieder.length) {
    goToPhase(4);
    renderErgebnis();
  } else {
    renderVoteForm();
  }
}

// ════════════════════════════════════════════════════════════════════════
// PHASE 4 – ERGEBNIS & GEWICHTUNGSLOGIK
// ════════════════════════════════════════════════════════════════════════

/**
 * Berechnet das Ergebnis für alle Kandidaten nach den Abstimmregeln.
 *
 * Stimmenkaskade (Regel 6):
 *   Vakanz-Stimmen → zählen für Vakanz UND Gast
 *   Gast-Stimmen   → zählen nur für Gast
 *
 * Zwei Wege pro Kategorie (Regeln 2 & 3):
 *   Weg A: ≥ 2/3 aller Anwesenden  UND  ≥ 51 % der eigenen Stimmgruppe
 *   Weg B: > 1/2 aller Anwesenden  UND  ≥ 75 % der eigenen Stimmgruppe
 *
 * Hierarchie: Vakanz → Gast → Nein (Regel 6)
 */
function berechneAlleErgebnisse() {
  return kandidaten.map(k => {
    let vV = 0, vG = 0, vN = 0;
    let sgV = 0, sgG = 0;

    const nGesamt = anwesendeMitglieder.length;
    const sgMitgl = anwesendeMitglieder.filter(m => normStimme(m.stimme) === k.stimmgruppe);
    const nSG     = sgMitgl.length;
    const sgIds   = new Set(sgMitgl.map(m => String(m.id)));

    Object.entries(stimmen).forEach(([mid, vs]) => {
      const kat  = vs[k.id] || 'Nein';
      const inSG = sgIds.has(mid);
      if      (kat === 'Vakanz') { vV++; if (inSG) sgV++; }
      else if (kat === 'Gast')   { vG++; if (inSG) sgG++; }
      else                       { vN++; }
    });

    // Gast (eff.) = Vakanz + Gast
    const effG   = vV + vG;
    const sgEffG = sgV + sgG;

    function besteht(eff, sgEff) {
      if (nGesamt === 0) return false;
      const rG  = eff / nGesamt;
      const rSG = nSG > 0 ? sgEff / nSG : 0;
      return (rG >= 2/3 && rSG >= 0.51) || (rG > 0.5 && rSG >= 0.75);
    }

    let ergebnis, effFuerRegel4;
    if      (besteht(vV,   sgV))   { ergebnis = 'Vakanz'; effFuerRegel4 = vV;   }
    else if (besteht(effG, sgEffG)){ ergebnis = 'Gast';   effFuerRegel4 = effG; }
    else                           { ergebnis = 'Nein';   effFuerRegel4 = 0;    }

    const pct = (n, d) => d > 0 ? (n / d * 100).toFixed(0) + '\u202f%' : '–';

    return {
      kandidat: k, ergebnis, effFuerRegel4,
      roh: { vV, vG, vN },
      eff: { gast: effG },
      sg:  { vakanz: sgV, gast: sgEffG },
      nGesamt, nSG,
    };
  });
}

/**
 * Regel 4: Nur innerhalb derselben Stimmgruppe und Kategorie —
 * wer die wenigsten effektiven Stimmen hat, wird zurückgestellt.
 */
function anwendeRegel4(ergebnisse) {
  ['Vakanz', 'Gast'].forEach(kat => {
    STIMMGRUPPEN.forEach(sg => {
      const gruppe = ergebnisse.filter(e =>
        e.ergebnis === kat && e.kandidat.stimmgruppe === sg
      );
      if (gruppe.length > 1) {
        const max = Math.max(...gruppe.map(e => e.effFuerRegel4));
        gruppe.forEach(e => {
          if (e.effFuerRegel4 < max) e.regel4Zurueck = true;
        });
      }
    });
  });
  return ergebnisse;
}

// ── Farben & Labels ────────────────────────────────────────────────────
const ERGEBNIS_STYLE = {
  'Vakanz':      { bg: '#3a4060', color: 'white', icon: '★' },
  'Gast':        { bg: '#2a5840', color: 'white', icon: '✓' },
  'Nein':        { bg: '#6a1c1c', color: 'white', icon: '✗' },
};

function ergebnisTag(e) {
  const s = ERGEBNIS_STYLE[e.ergebnis];
  const label = e.regel4Zurueck ? `${e.ergebnis} (Regel 4 ↓)` : e.ergebnis;
  const bg    = e.regel4Zurueck ? '#888' : s.bg;
  return `<span style="background:${bg};color:${s.color};padding:0.2rem 0.6rem;border-radius:3px;font-size:0.8rem;font-weight:700;letter-spacing:0.04em;">${s.icon} ${label}</span>`;
}

function renderErgebnis() {
  const ergebnisse = anwendeRegel4(berechneAlleErgebnisse());
  const total = anwesendeMitglieder.length;

  // Hinweis-Text: Kaskade kurz erklärt
  document.getElementById('resultMeta').innerHTML =
    `Anwesende Mitglieder: <em>${total}</em> &nbsp;·&nbsp; Kandidaten: <em>${kandidaten.length}</em><br>
     <small style="color:var(--muted)">
       Rohstimmen (Summe je Zeile = ${total}). Prozentangaben erscheinen in der
       für die Empfehlung ausschlaggebenden Spalte (Ges. / SG); bei Gast kaskadiert gemäß Regel 6. Zur Leitung werden nur Empfehlungen
       mitgeteilt (Regel 5), keine Prozentzahlen.
     </small>`;

  const rows = ergebnisse.map(e => {
    const { roh: r, nGesamt, nSG, ergebnis } = e;
    const k = e.kandidat;

    // Prozentwert (Ges. / SG) nur für die relevante Kategorie, kaskadiert
    const pct = (n, sg) => {
      const pg  = nGesamt > 0 ? (n    / nGesamt * 100).toFixed(0) + ' %' : '–';
      const psg = nSG     > 0 ? (sg   / nSG     * 100).toFixed(0) + ' %' : '–';
      return `<div style="font-size:0.72rem;color:var(--muted)">${pg} / ${psg}</div>`;
    };

    const pVakanz = ergebnis === 'Vakanz'      ? pct(r.vV,        e.sg.vakanz) : '';
    const pGast   = ergebnis === 'Gast'        ? pct(e.eff.gast,  e.sg.gast)   : '';

    return `
      <tr>
        <td><strong>${k.name}</strong></td>
        <td>${badge(k.stimmgruppe)}</td>
        <td class="center">
          <strong style="color:#2a6e3f">${r.vV}</strong>${pVakanz}
        </td>
        <td class="center">
          <strong style="color:#b8860b">${r.vG}</strong>${pGast}
        </td>
        <td class="center">
          <strong style="color:#9c2020">${r.vN}</strong>
        </td>
        <td>${ergebnisTag(e)}</td>
      </tr>`;
  }).join('');

  document.getElementById('ergebnisTabelle').innerHTML = `
    <div class="res-table-wrap">
    <table class="res-table">
      <thead>
        <tr>
          <th>Kandidat/in</th>
          <th>Stimmgr.</th>
          <th class="cat-v" style="text-align:center">Vakanz<div style="font-size:0.68rem;font-weight:400;opacity:0.85">Ges. / SG</div></th>
          <th class="cat-g" style="text-align:center">Gast <small>(eff.)</small></th>
          <th class="cat-n" style="text-align:center">Nein</th>
          <th>Empfehlung</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div id="ergebnisBeschreibungen" style="margin-top:1.5rem"></div>`;

  // ── Erläuterungstexte ─────────────────────────────────────────────
  document.getElementById('ergebnisBeschreibungen').innerHTML =
    ergebnisse.map(e => {
      const col = { 'Vakanz':'#2a6e3f','Gast':'#b8860b','Nein':'#9c2020' };
      return `
        <div style="border-left:3px solid ${col[e.ergebnis]};padding:0.6rem 1rem;
                    margin-bottom:0.75rem;background:#faf9f7;border-radius:0 4px 4px 0;
                    font-size:0.88rem;line-height:1.6;">
          <strong>${e.kandidat.name}</strong> &nbsp;${badge(e.kandidat.stimmgruppe)}<br>
          ${generiereText(e)}
        </div>`;
    }).join('');
}

// ════════════════════════════════════════════════════════════════════════
// ERLÄUTERUNGSTEXT PRO KANDIDAT
// ════════════════════════════════════════════════════════════════════════

/** Prüft, welcher Weg (A oder B) erfüllt ist, und gibt 'A', 'B' oder null zurück. */
function bestehtWeg(eff, sgEff, nGesamt, nSG) {
  if (nGesamt === 0) return null;
  const rG  = eff  / nGesamt;
  const rSG = nSG > 0 ? sgEff / nSG : 0;
  if (rG >= 2/3 && rSG >= 0.51) return 'A';
  if (rG >  0.5 && rSG >= 0.75) return 'B';
  return null;
}

function generiereText(e) {
  const { roh: r, eff, sg, nGesamt, nSG, ergebnis, kandidat: k } = e;
  const pct = (n, d) => d > 0 ? Math.round(n / d * 100) + '\u202f%' : '–';
  const sg_label = `${nSG} aus dem ${k.stimmgruppe}`;

  // ── Fall: Abgelehnt ───────────────────────────────────────────────
  if (ergebnis === 'Nein') {
    const maxEff = Math.max(r.vV, eff.gast);
    const besteKat = maxEff === r.vV ? 'Vakanz' : 'Gast';
    const besteEff = maxEff === r.vV ? r.vV : maxEff === eff.gast ? eff.gast : eff.verst;
    const besteSG  = maxEff === r.vV ? sg.vakanz : maxEff === eff.gast ? sg.gast : sg.verst;
    return `Von ${nGesamt} anwesenden Mitgliedern (davon ${sg_label}) stimmten ` +
      `${r.vV}× Vakanz, ${r.vG}× Gast und ${r.vN}× Nein. ` +
      `Auch unter Berücksichtigung der Stimmenkaskade (Regel\u00a06) wurde für keine ` +
      `Kategorie eine der erforderlichen Mehrheiten erreicht ` +
      `(beste effektive Quote: ${pct(besteEff, nGesamt)}\u202fges. / ` +
      `${pct(besteSG, nSG)}\u202fSG für ${besteKat}). ` +
      `<strong>Empfehlung: Abgelehnt.</strong>`;
  }

  // ── Einleitungssätze für hierarchische Fälle ──────────────────────
  let einleitung = '';
  if (ergebnis === 'Gast') {
    einleitung = `Für eine Vakanz-Einstellung reichte es nicht aus ` +
      `(${pct(r.vV, nGesamt)}\u202fges. / ${pct(sg.vakanz, nSG)}\u202fSG). `;
  }

  // ── Effektive Werte für die erreichte Kategorie ───────────────────
  const effN     = ergebnis === 'Vakanz' ? r.vV     : eff.gast;
  const sgEffN   = ergebnis === 'Vakanz' ? sg.vakanz : sg.gast;
  const kat_label = ergebnis === 'Vakanz'
    ? 'Vakanz'
    : `Gast (Vakanz\u202f+\u202fGast kaskadiert)`;

  const weg  = bestehtWeg(effN, sgEffN, nGesamt, nSG);
  const wegText = weg === 'A'
    ? `Die 2/3-Mehrheit (${pct(effN, nGesamt)}\u202fges.) und das 51\u202f%-Quorum der ` +
      `Stimmgruppe (${pct(sgEffN, nSG)}\u202fSG) wurden erfüllt\u202f(Weg\u202fA, Regel\u202f2).`
    : `Die einfache Mehrheit (${pct(effN, nGesamt)}\u202fges.) und das ¾-Quorum der ` +
      `Stimmgruppe (${pct(sgEffN, nSG)}\u202fSG) wurden erfüllt\u202f(Weg\u202fB, Regel\u202f3).`;

  // ── Regel-4-Zusatz ────────────────────────────────────────────────
  const regel4Text = e.regel4Zurueck
    ? ` Ein anderer Kandidat derselben Stimmgruppe erreichte dieselbe Kategorie mit mehr Stimmen — ` +
      `${k.name} wird daher zurückgestellt\u202f(Regel\u202f4).`
    : '';

  return `Von ${nGesamt} anwesenden Mitgliedern (davon ${sg_label}) entfielen ` +
    `${effN} Stimmen auf ${kat_label}. ` +
    einleitung + wegText + regel4Text +
    ` <strong>Empfehlung: ${e.regel4Zurueck ? ergebnis + ' – zurückgestellt' : ergebnis}.</strong>`;
}

// ════════════════════════════════════════════════════════════════════════
// CSV-EXPORT
// ════════════════════════════════════════════════════════════════════════
function exportCSV() {
  const ergebnisse = anwendeRegel4(berechneAlleErgebnisse());
  const header = [
    'Name','Stimmgruppe',
    'Vakanz','Gast (eff.)','Nein',
    'Empfehlung','Erläuterung'
  ];
  const rows = ergebnisse.map(e => {
    const { roh: r } = e;
    const empf = e.regel4Zurueck ? e.ergebnis + ' (zurückgestellt, Regel 4)' : e.ergebnis;
    const text = generiereText(e).replace(/<[^>]+>/g, '');
    return [
      e.kandidat.name, e.kandidat.stimmgruppe,
      r.vV, e.eff.gast, r.vN,
      empf, `"${text.replace(/"/g, '""')}"`
    ].join(';');
  });
  const csv  = csvBom() + [header.join(';'), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'vorsingen_ergebnis.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ════════════════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════════════════
function goToPhase(n) {
  document.querySelectorAll('.phase').forEach((el, i) => {
    el.classList.toggle('active', i + 1 === n);
  });
  ['step1','step2','step3','step4'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.classList.remove('active', 'done');
    if      (i + 1 === n) el.classList.add('active');
    else if (i + 1 <  n) el.classList.add('done');
    // Klickbar zurücknavigieren für bereits besuchte Schritte
    el.onclick = (i + 1 < n) ? () => goToPhase(i + 1) : null;
  });
  window.scrollTo(0, 0);
}
